<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#000000" />
<title>Sign in · Velocé Concierge</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap" />
<link rel="stylesheet" href="/admin/login.css" />
<script src="/admin/login.js" defer></script>
</head>
<body>
<main>
  <p class="wordmark">VELOCÉ</p>
  <h1>Concierge</h1>
  <p class="sub">Sign in to manage bookings and the fleet.</p>
  <form id="login" novalidate>
    <label for="password" class="sr">Password</label>
    <div class="field">
      <input type="password" name="password" id="password" placeholder="Password" autocomplete="current-password" required autofocus maxlength="1024" aria-describedby="error caps" />
      <button type="button" class="reveal" id="reveal" aria-label="Show password" aria-pressed="false">Show</button>
    </div>
    <p id="caps" class="caps" hidden>Caps Lock is on</p>
    <p id="error" role="alert"></p>
    <button type="submit" class="submit">Sign in</button>
  </form>
  <div id="google" hidden>
    <p class="or">or</p>
    <a class="google" href="/auth/google?for=admin">
      <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continue with Google
    </a>
  </div>
</main>
<p class="foot">Staff only. Sessions end after a few hours, and five wrong passwords pause sign-in for 15 minutes.</p>
</body>
</html>
