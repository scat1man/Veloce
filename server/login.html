<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>VELOCÉ · Concierge sign-in</title>
<link rel="stylesheet" href="/admin/admin.css" />
<script src="/admin/login.js" defer></script>
</head>
<body class="login">
<form id="login" novalidate>
  <h1>Velocé</h1>
  <span class="meta">Concierge · staff only</span>
  <div class="rule"></div>
  <label>
    <span class="meta">Password</span>
    <input type="password" name="password" id="password" autocomplete="current-password" required autofocus maxlength="1024" />
  </label>
  <p id="error" class="meta" role="alert"></p>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
