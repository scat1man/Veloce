<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Velocé Concierge · Sign in</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="/admin/login.css" />
<script src="/admin/login.js" defer></script>
</head>
<body>
<main class="card">
  <p class="wordmark">VELOCÉ</p>
  <h1>Concierge</h1>
  <p class="sub">Staff sign-in. This area is not part of the public website.</p>
  <form id="login" novalidate>
    <label for="password">Password</label>
    <input type="password" name="password" id="password" autocomplete="current-password" required autofocus maxlength="1024" />
    <p id="error" role="alert"></p>
    <button type="submit">Sign in</button>
  </form>
</main>
<p class="foot">Sessions end after a few hours. Too many wrong passwords lock sign-in for 15 minutes.</p>
</body>
</html>
