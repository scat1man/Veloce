<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VELOCÉ — Performance Car Rental, Delivered to Your Door</title>
    <meta name="description" content="Six exceptional performance cars in five American cities, delivered to your door by a personal concierge. VELOCÉ is a fictional demonstration brand." />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Sharing. Image paths are site-relative; for strict crawlers, make them absolute once the domain is known. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VELOCÉ" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="VELOCÉ — Supercar Rental, Handled Properly" />
    <meta property="og:description" content="Six exceptional performance cars in five American cities, delivered to your door. A fictional demonstration brand." />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A performance coupe silhouetted against a sunset, with the words Drive the exceptional." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VELOCÉ — Supercar Rental, Handled Properly" />
    <meta name="twitter:description" content="Six exceptional performance cars in five American cities, delivered to your door. A fictional demonstration brand." />
    <meta name="twitter:image" content="/og.jpg" />
    <meta name="twitter:image:alt" content="A performance coupe silhouetted against a sunset, with the words Drive the exceptional." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoRental",
        "name": "VELOCÉ",
        "slogan": "Supercar rental, handled properly.",
        "description": "Performance car rental with door-to-door delivery in Los Angeles, Miami, New York, Las Vegas and Scottsdale. VELOCÉ is a fictional demonstration brand: no vehicles are rented and no payments are taken. Vehicle manufacturers and trademarks belong to their respective owners.",
        "image": "/og.jpg",
        "logo": "/icon-512.png",
        "email": "concierge@veloce.example",
        "priceRange": "$$$$",
        "areaServed": [
          { "@type": "City", "name": "Los Angeles" },
          { "@type": "City", "name": "Miami" },
          { "@type": "City", "name": "New York" },
          { "@type": "City", "name": "Las Vegas" },
          { "@type": "City", "name": "Scottsdale" }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Brand marks are black artwork on white panels: these filters turn ink into the
         site's colour and the white panels into transparency (components/BrandLogo.tsx). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="logo-on-dark" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.96  0 0 0 0 0.97  -0.2126 -0.7152 -0.0722 1 0" />
      </filter>
      <filter id="logo-on-light" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0 0 0 0 0.04  0 0 0 0 0.04  0 0 0 0 0.045  -0.2126 -0.7152 -0.0722 1 0" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
