# Render Blueprint for VELOCÉ — one free Node web service that serves the site and the API.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    runtime: node
    name: veloce
    plan: free                      # 512 MB RAM, sleeps after 15 min idle, disk is NOT persistent
    region: oregon                  # or frankfurt / singapore / ohio / virginia — pick the one nearest your clients
    branch: main
    # NODE_ENV=production below would make `npm ci` skip devDependencies (TypeScript, Vite),
    # which the build needs, so ask for them explicitly.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit       # every `git push` to main redeploys
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD         # Render asks you for this when you create the Blueprint
        sync: false
      # Safer alternative: run `npm run hash-password` locally, put the result in
      # ADMIN_PASSWORD_HASH and delete ADMIN_PASSWORD. The hash wins when both are set.
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # Booking emails (optional, see DEPLOY.md): leave empty to keep them off.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OWNER_EMAIL
        sync: false
      # Optional "Sign in with Google" (see DEPLOY.md). Leave all three empty to switch it off.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_GOOGLE_EMAILS    # Google accounts allowed into /admin, comma-separated
        sync: false
      - key: TRUST_PROXY            # Render puts one proxy in front of the app
        value: "1"
      # Online deposits (optional, see DEPLOY.md): add these in the Environment tab when ready.
      # RAZORPAY_KEY_ID (rzp_test_...), RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
      # PAYMENT_DEPOSIT (default 5000), PAYMENT_CURRENCY (default INR).
